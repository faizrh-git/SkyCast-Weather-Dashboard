<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatbot test</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; }
    #log { border: 1px solid #ccc; height: 350px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
    .user { text-align: right; color: #0b5; margin: 6px 0; }
    .bot { margin: 6px 0; }
    .error { color: #c00; margin: 6px 0; }
    input { width: 75%; padding: 8px; }
    button { padding: 8px 14px; }
  </style>
</head>
<body>
  <h3>Chatbot logic test</h3>
  <div id="log"></div>
  <input id="msg" placeholder="Try: weather in London, or: what is a black hole?">
  <button id="send">Send</button>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/chatbot.js"></script>
  <script>
    const log = document.getElementById("log");
    const input = document.getElementById("msg");

    function add(cls, text) {
      const div = document.createElement("div");
      div.className = cls;
      div.textContent = text;   // textContent keeps model output from injecting HTML
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      add("user", text);
      const reply = await GeminiChat.sendMessage(text);
      add(reply.type === "error" ? "error" : "bot", reply.text);
    }

    document.getElementById("send").onclick = send;
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
  </script>
</body>
</html>
